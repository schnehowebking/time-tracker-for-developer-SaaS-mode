<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>
  <header class="topbar">
    <h1>Time Tracker SaaS</h1>
  </header>
  <section class="status-row">
    <article class="card">
      <h2>Login</h2>
      {% if error %}<p style="color:#c81d25;"><strong>{{ error }}</strong></p>{% endif %}
      <form method="post" action="/auth/login">
        <p><label>Email</label><br><input type="email" name="email" required /></p>
        <p><label>Password</label><br><input type="password" name="password" required /></p>
        <p><button type="submit">Login</button></p>
      </form>
      <p>No workspace yet? <a href="/auth/register">Create one</a></p>
    </article>
  </section>
</body>
</html>
